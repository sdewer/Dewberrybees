  @font-face{font-family:'Cardenio Modern Bold';src:url('https://static.wfonts.com/data/2016/07/17/cardenio-modern/Cardenio%20Modern%20Bold.woff') format('woff');font-weight:700;font-display:swap;}
  @font-face{font-family:'Cardenio Modern';src:url('https://static.wfonts.com/data/2016/07/17/cardenio-modern/Cardenio_Modern.woff') format('woff');font-weight:400;font-display:swap;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Cardenio Modern',Georgia,serif;background:#f5f0fb;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;}
  .card{width:100%;max-width:420px;background:#f9f5ff;box-shadow:0 8px 40px rgba(107,63,160,0.13);overflow:hidden;position:relative;}
  .hero{background:#FEC117;padding:2.2rem 1.5rem 1.3rem;text-align:center;}
  .headshot-wrap{position:relative;display:inline-block;margin-bottom:1.1rem;}
  .headshot-ring{width:145px;height:145px;border-radius:50%;border:4px solid #5B2D8E;overflow:hidden;background:#c9a8e0;box-shadow:0 4px 18px rgba(91,45,142,0.28);}
  .headshot-ring img{width:115%;height:115%;object-fit:cover;object-position:center 12%;margin-left:-7.5%;display:block;}
  .headshot-badge{position:absolute;bottom:-3px;right:-3px;width:38px;height:38px;border-radius:50%;border:2px solid #FEC117;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.2);}
  .headshot-badge img{width:100%;height:100%;object-fit:cover;}
  .hero-name{font-family:'Cardenio Modern Bold',Georgia,serif;font-weight:700;font-size:clamp(3.2rem,11vw,4.2rem);color:#3d1a70;letter-spacing:0.01em;line-height:1.05;margin-bottom:0.35rem;}
  .hero-title{font-family:'Aurelia Emiko','Palatino Linotype',Georgia,serif;font-size:1.55rem;color:rgba(61,26,112,0.8);letter-spacing:0.04em;margin-bottom:1rem;}
  .hero-contact{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:0.85rem;}
  .hero-contact a{display:flex;align-items:center;gap:8px;font-size:1.35rem;color:#3d1a70;text-decoration:none;opacity:0.9;font-family:'Cardenio Modern',Georgia,serif;}
  .hero-contact a:hover{opacity:1;}
  .hero-loc{font-size:1.2rem;color:rgba(61,26,112,0.65);display:flex;align-items:center;justify-content:center;gap:5px;}
  .drips-wrap{display:block;width:100%;line-height:0;font-size:0;padding:0;margin:0;background:#f9f5ff;border:none;}
  .drips-wrap img{display:block;width:100%;max-height:70px;object-fit:cover;object-position:top center;vertical-align:top;}
  .body{background:#f9f5ff;padding:1.4rem 1.25rem 2rem;}
  .brand-header{text-align:center;margin-bottom:1.4rem;}
  .brand-header-name{font-family:'Cardenio Modern Bold',Georgia,serif;font-weight:700;font-size:3.2rem;color:#3d1a70;letter-spacing:0.02em;line-height:1.1;display:block;margin-bottom:0.25rem;}
  .brand-header-sub{font-family:'Aurelia Emiko','Palatino Linotype',Georgia,serif;font-size:1.15rem;color:#7a4faa;letter-spacing:0.04em;display:block;}
  .icon-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
  .icon-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:none;background:transparent;cursor:pointer;transition:transform 0.12s ease;padding:0;}

  .icon-svg-wrap svg{display:block;width:100%;height:100%;}
  .icon-btn-label{font-family:'Cardenio Modern Bold',Georgia,serif;font-size:0.88rem;font-weight:700;letter-spacing:0.02em;text-align:center;}
  .label-web{color:#5B2D8E;}.label-ig{color:#c13584;}.label-fb{color:#1877F2;}
  .btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;text-decoration:none;border:none;cursor:pointer;width:100%;transition:transform 0.12s ease;margin-bottom:10px;}
  .btn:active{transform:scale(0.97);}
  .btn-icon{width:auto;height:auto;background:transparent;color:#6B3FA0;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
  .btn-label{flex:1;text-align:left;}
  .btn-main{display:block;font-family:'Cardenio Modern Bold',Georgia,serif;font-weight:700;font-size:1.15rem;line-height:1.2;color:#3d1a70;}
  .btn-sub{display:block;font-family:'Cardenio Modern',Georgia,serif;font-size:0.82rem;color:#7a5fa0;margin-top:2px;}
  .btn-arr{font-size:18px;color:#9B6EC8;}
  .btn-mail{background:#fff;border:1.5px solid #ddd0f0;justify-content:center;gap:6px;}
  .btn-mail .btn-label{flex:0 0 auto;text-align:center;}
  .save-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:14px;background:#FEC117;color:#3d1a70;font-family:'Cardenio Modern Bold',Georgia,serif;font-weight:700;font-size:1.15rem;border:none;cursor:pointer;transition:transform 0.12s ease;text-decoration:none;}
  .save-btn:active{transform:scale(0.97);}
