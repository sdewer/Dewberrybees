<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://dewberrybees.com/contact.html" />
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#6B3FA0" />
  <title>Contact Us | Dewberry Bees</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var el = document.getElementById('nav-contact');
      if (el) el.classList.add('active');
    });
  </script>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QE41VKG9SX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QE41VKG9SX');
  </script>
</head>
<body>

  <nav class="nav-bar">
    <div class="nav-links">
      <a href="index.html" class="nav-btn" id="nav-home">Home</a>
      <a href="about.html" class="nav-btn" id="nav-about">About Us</a>
      <a href="contact.html" class="nav-btn" id="nav-contact">Contact Us</a>
      <a href="products.html" class="nav-btn" id="nav-products">Our Products</a>
      <a href="sponsorship.html" class="nav-btn" id="nav-sponsor">Hive Sponsorship</a>
    </div>
  </nav>

  <div class="nav-spacer" id="nav-spacer"></div>

  <header class="site-header">
    <img src="drips.png" alt="" role="presentation" />
  </header>

<main class="contact-main">
      <img src="logo.png" alt="Dewberry Bees" style="width:clamp(180px,45vw,320px);height:auto;border-radius:50%;filter:drop-shadow(0 8px 24px rgba(107,63,160,0.25));" />
      <h1>Contact Us</h1>
      <p>Got a question about our honey, bee products, swarm collection or hive sponsorship? We'd love to hear from you.</p>

      <div class="contact-form">
        <div class="form-success" id="form-success">
          <img src="bee-logo.png" alt="🐝" style="width:32px;height:auto;display:inline-block;vertical-align:middle;transform:rotate(-15deg);margin-right:8px;" /> Thank you! We'll be in touch soon.
        </div>
        <form id="contact-form" action="https://formspree.io/f/xkokajab" method="POST">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="" required />

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="" required />

          <label for="message">Your Question or Message</label>
          <textarea id="message" name="message" placeholder="Tell us what you'd like to know..." required></textarea>

          <button type="submit" class="submit-btn" id="submit-btn">Send Message <img src="bee-logo.png" alt="🐝" style="width:24px;height:auto;display:inline-block;vertical-align:middle;transform:rotate(10deg);margin-left:6px;" /></button>
        </form>
      </div>
    </main>

  <footer>
    <img src="bottom-wave.png" alt="" role="presentation" style="display:block;width:100%;height:auto;margin:0;padding:0;border:none;" />
    <p style="background-color:#FFC117;color:#000000;font-family:var(--font-bold);font-weight:700;font-size:1rem;text-align:center;margin:0;padding:6px 16px 8px;">© 2025 Dewberry Bees · Nailsea, England.</p>
  </footer>


  <script>
    const form = document.getElementById('contact-form');
    if (form) {
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const response = await fetch('https://formspree.io/f/xkokajab', {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });
          if (response.ok) {
            form.style.display = 'none';
            document.getElementById('form-success').style.display = 'block';
          } else {
            btn.disabled = false;
            btn.textContent = 'Send Message';
            alert('Something went wrong. Please try again.');
          }
        } catch(err) {
          btn.disabled = false;
          btn.textContent = 'Send Message';
          alert('Something went wrong. Please try again.');
        }
      });
    }
  </script>
  <script>
    // Dynamically match body top padding to actual nav height
    function adjustForNav() {
      var nav = document.querySelector('.nav-bar');
      var spacer = document.getElementById('nav-spacer');
      if (nav && spacer) {
        spacer.style.height = nav.offsetHeight + 'px';
      }
    }
    adjustForNav();
    window.addEventListener('resize', adjustForNav);
    window.addEventListener('load', adjustForNav);
  </script>
</body>
</html>
